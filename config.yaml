cases:
  - high/exact-copy
  - high/formatting
  - high/lang-similar-syntax
  - high/lang-different-syntax
  - high/renamed-identifiers
  - high/different-literals
  - high/reordered-statements
  - high/refactored-structure
  - high/small-addition
  - high/small-additions-large
  - high/different-algorithm
  - high/transpiled
  - high/code-and-text
  - low/unrelated
  - low/same-identifiers
  - low/small-shared-fragment
  - low/small-shared-fragments-large
  - low/same-boilerplate
  - low/code-and-text

case_diff:
  - name: code description
    high: high/code-and-text
    low: low/code-and-text
  - name: code behavior
    high: high/different-algorithm
    low: low/unrelated
  - name: boilerplate impact
    high: low/same-boilerplate
    low: low/unrelated
  - name: identifier insensitivity
    high: high/renamed-identifiers
    low: low/same-identifiers
